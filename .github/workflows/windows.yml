name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['index.html', 'js/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run prepare-app
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Steam build folder
        uses: actions/upload-artifact@v4
        with:
          name: CampSurvivor-Steam-build
          path: desktop/dist/win-unpacked/
      - name: Upload portable exe (for testing)
        uses: actions/upload-artifact@v4
        with:
          name: CampSurvivor-portable
          path: desktop/dist/CampSurvivor-portable.exe
      # Steam demo: same game, stops after the first region's boss (see prepare.js --demo)
      - run: node prepare.js --demo
      - run: npx electron-builder --win dir --x64 -c.productName="Camp Survivor Demo" -c.directories.output=dist-demo
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Steam demo build folder
        uses: actions/upload-artifact@v4
        with:
          name: CampSurvivor-Steam-demo
          path: desktop/dist-demo/win-unpacked/
